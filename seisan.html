<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅行費用 共同精算 (リアルタイム同期)</title>
  
  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #38bdf8;
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #f87171;
      --success: #34d399;
      --line-green: #06c755;
      --accent-badge: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 12px; line-height: 1.5; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 4px; }
    
    /* LINE共有 & 同期状態バー */
    .sync-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 0.8rem; }
    .sync-status { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .status-dot.syncing { background: var(--accent-badge); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn-line-share { width: 100%; background: var(--line-green); color: #fff; font-weight: bold; padding: 10px; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 14px; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* 横スクロールタブ */
    .tabs-wrapper { overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
    .tabs { display: flex; gap: 8px; width: max-content; min-width: 100%; background: #1e293b; padding: 6px; border-radius: 10px; border: 1px solid var(--border); }
    .tab-btn { padding: 8px 14px; border: none; background: transparent; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; white-space: nowrap; }
    .tab-btn.active { background: #334155; color: var(--primary); }
    .tab-btn.result-tab { background: #0f172a; color: #cbd5e1; border: 1px solid var(--border); }
    .tab-btn.result-tab.active { background: var(--primary); color: #0f172a; }

    /* カード・入力行 */
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 14px; border-left: 4px solid var(--primary); padding-left: 8px; display: flex; justify-content: space-between; align-items: center; }
    .expense-row { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; background: var(--card-inner); }
    .row-header { display: flex; justify-content: space-between; align-items: center; }
    .row-title-badge { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); }
    
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .input-grid { grid-template-columns: 1fr; } }

    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; background: #1e293b; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; color: #fff; }
    input:focus { outline: none; border-color: var(--primary); }
    
    /* 傾斜配分 */
    .ratio-section { background: #172554; padding: 10px 12px; border-radius: 6px; border: 1px solid #1e40af; }
    .ratio-title { font-size: 0.75rem; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
    .ratio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .ratio-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; }
    .ratio-item label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
    .ratio-input { width: 48px !important; padding: 4px !important; text-align: center; }

    /* ボタン */
    .btn { padding: 10px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; min-height: 40px; }
    .btn-block { width: 100%; }
    .btn-secondary { background: #334155; color: var(--primary); border: 1px solid var(--border); }
    .btn-danger-sm { background: transparent; color: var(--danger); border: 1px solid #7f1d1d; padding: 4px 8px; font-size: 0.75rem; }

    /* 精算結果 */
    .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--card-inner); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); }
    .stat-card .value { font-size: 1.25rem; font-weight: bold; color: var(--primary); margin-top: 2px; }

    .transfer-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .transfer-item { display: flex; flex-direction: column; gap: 4px; background: var(--card-inner); padding: 12px; border-radius: 8px; border-left: 4px solid var(--success); border: 1px solid var(--border); }
    .transfer-route { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; }
    .transfer-amount { font-weight: bold; font-size: 1.15rem; color: #34d399; }
    .badge-round { font-size: 0.7rem; background: #451a03; color: var(--accent-badge); padding: 2px 6px; border-radius: 4px; }

    .table-container { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 420px; }
    th, td { padding: 8px 10px; border: 1px solid var(--border); }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🌴 旅行費用 クラウド共同精算</h1>

  <div class="sync-bar">
    <div class="sync-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="syncText">クラウド同期中...</span>
    </div>
    <span style="color:var(--text-muted); font-size:0.75rem;">リアルタイム自動保存</span>
  </div>

  <!-- 固定の短いURLをLINEで共有 -->
  <button class="btn-line-share" onclick="shareAppUrl()">
    💬 この精算ページをLINEで共有
  </button>

  <div class="tabs-wrapper">
    <div class="tabs" id="tabContainer"></div>
  </div>

  <div id="inputPanels"></div>

  <div id="resultPanel" class="card hidden">
    <div class="card-title">
      <span>📊 精算結果</span>
      <span class="badge-round">10円以下四捨五入（100円単位）</span>
    </div>
    
    <div class="summary-box">
      <div class="stat-card">
        <div class="label">総額 (税込)</div>
        <div class="value" id="totalAmount">¥0</div>
      </div>
      <div class="stat-card">
        <div class="label">登録件数</div>
        <div class="value" id="totalCount">0 件</div>
      </div>
    </div>

    <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: var(--primary);">💸 送金リスト（誰が → 誰に）</h3>
    <div id="transferContainer" class="transfer-list"></div>

    <h3 style="font-size: 0.95rem; margin-top: 20px; margin-bottom: 8px; color: var(--primary);">📋 収支一覧</h3>
    <div class="table-container">
      <div id="memberBreakdown"></div>
    </div>
  </div>
</div>

<script>
  // ★ ここに手順1で取得したFirebase設定を貼り付けます ★
  const firebaseConfig = {
    apiKey: "AIzaSyC_bKAUbGiiSAjgwBMGgbYm95w28SQZEc4",
    authDomain: "earth--cerebration2026-seisan.firebaseapp.com",
    projectId: "earth--cerebration2026-seisan",
    storageBucket: "earth--cerebration2026-seisan.firebasestorage.app",
    messagingSenderId: "97177992765",
    appId: "1:97177992765:web:74c6d98e73464933ec7454"
  };

  const MEMBERS = ['三村', '角田', '東', '松川', '桐生'];
  
  let expenses = {
    '三村': [],
    '角田': [],
    '東': [],
    '松川': [],
    '桐生': []
  };

  let currentTab = '三村';
  let db = null;
  let isFirebaseReady = false;
  let saveTimeout = null;

  // Firebase初期化 & リアルタイムリスナー設定
  function initFirebase() {
    if (firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('YOUR_')) {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseReady = true;

        // クラウドの変更をリアルタイム監視
        db.collection('trips').doc('main_settlement').onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data && data.expenses) {
              expenses = data.expenses;
              MEMBERS.forEach(m => {
                if (!Array.isArray(expenses[m])) expenses[m] = [];
              });
              renderAllExpenses();
              setSyncStatus(false, 'リアルタイム同期中');
            }
          } else {
            // 初期データ作成
            saveToCloud();
          }
        }, (error) => {
          console.error(error);
          setSyncStatus(false, '同期エラー（ローカル動作中）');
        });
      } catch (e) {
        console.error(e);
      }
    } else {
      setSyncStatus(false, '⚠️ Firebase未設定（ローカル保存中）');
      loadFromLocal();
      renderAllExpenses();
    }
  }

  function queueSave() {
    setSyncStatus(true, '保存中...');
    localStorage.setItem('OFFLINE_BACKUP', JSON.stringify(expenses));

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      saveToCloud();
    }, 600);
  }

  function saveToCloud() {
    if (!isFirebaseReady || !db) return;
    db.collection('trips').doc('main_settlement').set({
      expenses: expenses,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      setSyncStatus(false, 'クラウド保存完了');
    }).catch((err) => {
      console.error(err);
      setSyncStatus(false, '保存失敗');
    });
  }

  function loadFromLocal() {
    const saved = localStorage.getItem('OFFLINE_BACKUP');
    if (saved) {
      try { expenses = JSON.parse(saved); } catch (e) {}
    }
  }

  function setSyncStatus(isSyncing, text) {
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('syncText');
    if (dot) dot.className = `status-dot ${isSyncing ? 'syncing' : ''}`;
    if (label) label.textContent = text;
  }

  // 短いページURLをそのままLINEで送信
  function shareAppUrl() {
    const pageUrl = window.location.origin + window.location.pathname;
    const shareText = encodeURIComponent(`【旅行の精算ページ】\nリアルタイムで更新される精算ページです。こちらから各自入力してください：\n${pageUrl}`);
    window.open(`https://line.me/R/msg/text/?${shareText}`, '_blank');
  }

  function init() {
    renderTabs();
    renderPanels();
    initFirebase();
  }

  function renderTabs() {
    const container = document.getElementById('tabContainer');
    container.innerHTML = '';
    
    MEMBERS.forEach(m => {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${m === currentTab ? 'active' : ''}`;
      btn.textContent = `${m}`;
      btn.onclick = () => switchTab(m);
      container.appendChild(btn);
    });

    const resBtn = document.createElement('button');
    resBtn.className = `tab-btn result-tab ${currentTab === 'RESULT' ? 'active' : ''}`;
    resBtn.textContent = '📊 精算画面';
    resBtn.onclick = () => switchTab('RESULT');
    container.appendChild(resBtn);
  }

  function switchTab(tab) {
    currentTab = tab;
    renderTabs();

    MEMBERS.forEach(m => {
      const panel = document.getElementById(`panel-${m}`);
      if (panel) panel.classList.toggle('hidden', m !== currentTab);
    });

    const resultPanel = document.getElementById('resultPanel');
    if (tab === 'RESULT') {
      resultPanel.classList.remove('hidden');
      calculateSettlement();
    } else {
      resultPanel.classList.add('hidden');
    }
  }

  function renderPanels() {
    const container = document.getElementById('inputPanels');
    container.innerHTML = '';

    MEMBERS.forEach(m => {
      const panel = document.createElement('div');
      panel.id = `panel-${m}`;
      panel.className = `card ${m === currentTab ? '' : 'hidden'}`;
      panel.innerHTML = `
        <div class="card-title">${m} さんの支払い入力</div>
        <div id="list-${m}"></div>
        <button class="btn btn-secondary btn-block" onclick="addExpenseRow('${m}')">＋ 支払いを追加</button>
      `;
      container.appendChild(panel);
    });
  }

  function renderAllExpenses() {
    MEMBERS.forEach(m => {
      const listContainer = document.getElementById(`list-${m}`);
      listContainer.innerHTML = '';
      if (expenses[m].length === 0) {
        addExpenseRow(m, false);
      } else {
        expenses[m].forEach(item => renderRowElement(m, item));
      }
    });
  }

  function roundToHundred(val) {
    return Math.round(val / 100) * 100;
  }

  function addExpenseRow(payer, shouldSave = true) {
    const id = Date.now() + Math.random();
    const ratios = {};
    MEMBERS.forEach(m => { ratios[m] = 1.0; });

    const item = { id, title: '', amount: 0, ratios };
    expenses[payer].push(item);
    renderRowElement(payer, item);
    if (shouldSave) queueSave();
  }

  function renderRowElement(payer, item) {
    const listContainer = document.getElementById(`list-${payer}`);
    const row = document.createElement('div');
    row.className = 'expense-row';
    row.id = `row-${item.id}`;

    const ratioHtml = MEMBERS.map(m => {
      const weight = item.ratios && item.ratios[m] !== undefined ? item.ratios[m] : 1.0;
      const isChecked = weight > 0;
      return `
        <div class="ratio-item">
          <label>
            <input type="checkbox" id="chk-${item.id}-${m}" ${isChecked ? 'checked' : ''} onchange="toggleMember('${payer}', ${item.id}, '${m}', this.checked)">
            <span>${m}</span>
          </label>
          <input type="number" step="0.1" min="0" value="${weight || 1.0}" ${!isChecked ? 'disabled' : ''} class="ratio-input" inputmode="decimal" id="ratio-${item.id}-${m}" oninput="updateRatio('${payer}', ${item.id}, '${m}', this.value)">
        </div>
      `;
    }).join('');

    row.innerHTML = `
      <div class="row-header">
        <span class="row-title-badge">項目明細</span>
        <button class="btn-danger-sm" onclick="removeExpenseRow('${payer}', ${item.id})">削除</button>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label>費目</label>
          <input type="text" placeholder="例: レンタカー、夕食代" value="${item.title || ''}" oninput="updateField('${payer}', ${item.id}, 'title', this.value)">
        </div>
        <div class="input-group">
          <label>金額 (税込)</label>
          <input type="number" min="0" placeholder="0" inputmode="numeric" value="${item.amount || ''}" oninput="updateField('${payer}', ${item.id}, 'amount', Number(this.value))">
        </div>
      </div>

      <div class="ratio-section">
        <div class="ratio-title">⚖️ 対象者と傾斜配分比率（均等:1.0 / 外す:チェックOFF）</div>
        <div class="ratio-grid">${ratioHtml}</div>
      </div>
    `;
    listContainer.appendChild(row);
  }

  function updateField(payer, id, field, value) {
    const item = expenses[payer].find(x => x.id === id);
    if (item) {
      item[field] = value;
      queueSave();
    }
  }

  function updateRatio(payer, id, member, val) {
    const item = expenses[payer].find(x => x.id === id);
    if (item) {
      item.ratios[member] = Math.max(0, parseFloat(val) || 0);
      queueSave();
    }
  }

  function toggleMember(payer, id, member, isChecked) {
    const input = document.getElementById(`ratio-${id}-${member}`);
    if (isChecked) {
      input.disabled = false;
      if (parseFloat(input.value) === 0) input.value = "1.0";
      updateRatio(payer, id, member, input.value);
    } else {
      input.disabled = true;
      updateRatio(payer, id, member, 0);
    }
  }

  function removeExpenseRow(payer, id) {
    expenses[payer] = expenses[payer].filter(x => x.id !== id);
    const elem = document.getElementById(`row-${id}`);
    if (elem) elem.remove();
    queueSave();
  }

  function calculateSettlement() {
    let totalSpend = 0;
    let validCount = 0;
    
    const paidTotal = {};
    const costTotal = {};
    const rawBalance = {};

    MEMBERS.forEach(m => {
      paidTotal[m] = 0;
      costTotal[m] = 0;
      rawBalance[m] = 0;
    });

    MEMBERS.forEach(payer => {
      expenses[payer].forEach(item => {
        const amt = Number(item.amount) || 0;
        if (amt > 0) {
          let totalWeight = 0;
          MEMBERS.forEach(m => {
            totalWeight += (item.ratios && item.ratios[m] !== undefined ? item.ratios[m] : 0);
          });

          if (totalWeight > 0) {
            totalSpend += amt;
            validCount++;
            paidTotal[payer] += amt;

            MEMBERS.forEach(m => {
              const weight = item.ratios[m] || 0;
              if (weight > 0) {
                const share = amt * (weight / totalWeight);
                costTotal[m] += share;
              }
            });
          }
        }
      });
    });

    const roundedBalance = {};
    MEMBERS.forEach(m => {
      rawBalance[m] = paidTotal[m] - costTotal[m];
      roundedBalance[m] = roundToHundred(rawBalance[m]);
    });

    document.getElementById('totalAmount').textContent = `¥${Math.round(totalSpend).toLocaleString()}`;
    document.getElementById('totalCount').textContent = `${validCount} 件`;

    const debtors = [];
    const creditors = [];

    MEMBERS.forEach(m => {
      const net = roundedBalance[m];
      if (net < 0) debtors.push({ name: m, amount: -net });
      else if (net > 0) creditors.push({ name: m, amount: net });
    });

    const transfers = [];
    let dIdx = 0, cIdx = 0;

    while (dIdx < debtors.length && cIdx < creditors.length) {
      const debtor = debtors[dIdx];
      const creditor = creditors[cIdx];
      const pay = Math.min(debtor.amount, creditor.amount);

      if (pay > 0) {
        transfers.push({ from: debtor.name, to: creditor.name, amount: pay });
      }

      debtor.amount -= pay;
      creditor.amount -= pay;

      if (debtor.amount <= 0) dIdx++;
      if (creditor.amount <= 0) cIdx++;
    }

    const transferContainer = document.getElementById('transferContainer');
    transferContainer.innerHTML = '';

    if (transfers.length === 0) {
      transferContainer.innerHTML = '<div style="color: var(--text-muted); padding: 10px; font-size: 0.9rem;">精算が必要な差額はありません。</div>';
    } else {
      transfers.forEach(t => {
        const item = document.createElement('div');
        item.className = 'transfer-item';
        item.innerHTML = `
          <div class="transfer-route">
            <div><strong style="color:#38bdf8;">${t.from}</strong> ➔ <strong style="color:#34d399;">${t.to}</strong></div>
            <div class="transfer-amount">¥${t.amount.toLocaleString()}</div>
          </div>
        `;
        transferContainer.appendChild(item);
      });
    }

    const breakdown = document.getElementById('memberBreakdown');
    breakdown.innerHTML = `
      <table>
        <thead>
          <tr style="background: var(--card-inner); text-align: left;">
            <th>名前</th>
            <th>立替総額</th>
            <th>負担額</th>
            <th>精算額</th>
          </tr>
        </thead>
        <tbody>
          ${MEMBERS.map(m => {
            const netRounded = roundedBalance[m];
            const color = netRounded > 0 ? '#34d399' : (netRounded < 0 ? '#f87171' : '#94a3b8');
            const statusText = netRounded > 0 ? `+¥${netRounded.toLocaleString()}` : (netRounded < 0 ? `-¥${(-netRounded).toLocaleString()}` : '¥0');

            return `
              <tr>
                <td style="font-weight: bold; color: #fff;">${m}</td>
                <td>¥${Math.round(paidTotal[m]).toLocaleString()}</td>
                <td>¥${Math.round(costTotal[m]).toLocaleString()}</td>
                <td style="font-weight: bold; color: ${color};">${statusText}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  window.onload = init;
</script>
</body>
</html>
